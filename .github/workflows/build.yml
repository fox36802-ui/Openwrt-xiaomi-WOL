name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/tag 的新构建会取消上一次未完成的，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 语法与静态检查：不产出二进制，但能挡住绝大多数低级错误
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell 语法（bash）
        run: |
          for f in build.sh install.sh uninstall.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: shell 语法（POSIX sh，路由器上是 ash）
        run: |
          for f in install.sh uninstall.sh \
                   luci-app-cloud-control/root/etc/init.d/cloud_control; do
            sh -n "$f" && echo "OK  $f"
          done

      - name: JS 语法
        run: |
          node --check \
            luci-app-cloud-control/htdocs/luci-static/resources/view/cloud_control/settings.js

      - name: JSON 合法性
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "OK  $f"
          done

      - name: C 编译零告警
        run: |
          gcc -c -O2 -Wall -Wextra -Werror -o /dev/null cloud-control/src/cloud_control.c

  # 双架构静态编译
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
    steps:
      - uses: actions/checkout@v4

      # musl.cc 的下载经常中断（连接被重置），所以必须：
      #   1) 设超时，不能让它无限挂着把 job 拖到 6 小时
      #   2) 断点续传重试
      #   3) 主源失败后换 more.musl.cc 镜像
      - name: 取 musl 交叉工具链
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -u
          primary="https://musl.cc/${ARCH}-linux-musl-cross.tgz"
          mirror="https://more.musl.cc/11.2.1/${ARCH}-linux-musl/${ARCH}-linux-musl-cross.tgz"

          ok=0
          for url in "$primary" "$mirror"; do
            echo "== 下载源：$url"
            for i in 1 2 3 4 5; do
              if curl -fsSL -C - --connect-timeout 20 --max-time 300 -o tc.tgz "$url"; then
                ok=1
                break
              fi
              sz=$(stat -c %s tc.tgz 2>/dev/null || echo 0)
              echo "  第 $i 次中断（已下载 ${sz} 字节），续传重试"
              sleep 3
            done
            [ "$ok" = 1 ] && break
            rm -f tc.tgz
          done

          if [ "$ok" != 1 ]; then
            echo "::error::工具链下载失败，主源和镜像都没成功"
            exit 1
          fi

          tar -xzf tc.tgz
          "./${ARCH}-linux-musl-cross/bin/${ARCH}-linux-musl-gcc" --version | head -1

      - name: 编译并打包
        run: |
          chmod +x build.sh install.sh uninstall.sh
          ./build.sh --arch ${{ matrix.arch }} \
                     --toolchain "$PWD/${{ matrix.arch }}-linux-musl-cross"

      - name: 校验产物（必须静态、零依赖）
        run: |
          f="prebuilt/${{ matrix.arch }}/cloud_control"
          file "$f"
          readelf -h "$f" | grep -q 'EXEC'
          if readelf -d "$f" | grep -q NEEDED; then
            echo "::error::产物仍有动态库依赖"
            exit 1
          fi
          echo "静态、零依赖 ✓"

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cloud-control-${{ matrix.arch }}
          path: luci-app-cloud-control-*-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 打 tag 时自动建 Release 并附上两个架构的压缩包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ lint, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列一下待发布的文件
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
