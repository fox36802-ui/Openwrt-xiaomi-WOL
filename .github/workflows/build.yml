name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/tag 的新构建会取消上一次未完成的，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 语法与静态检查：不产出二进制，但能挡住绝大多数低级错误
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell 语法（bash）
        run: |
          for f in build.sh install.sh uninstall.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: shell 语法（POSIX sh，路由器上是 ash）
        run: |
          for f in install.sh uninstall.sh \
                   luci-app-cloud-control/root/etc/init.d/cloud_control; do
            sh -n "$f" && echo "OK  $f"
          done

      - name: JS 语法
        run: |
          node --check \
            luci-app-cloud-control/htdocs/luci-static/resources/view/cloud_control/settings.js

      - name: JSON 合法性
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" && echo "OK  $f"
          done

      - name: C 编译零告警
        run: |
          gcc -c -O2 -Wall -Wextra -Werror -o /dev/null cloud-control/src/cloud_control.c

  # 双架构静态编译
  #
  # 这里不用 musl.cc 的交叉工具链：那个站点从 GitHub 的机器上基本拉不动，
  # 试过 5 次续传 + 备用镜像仍然失败。改成在 Alpine 容器里用 musl 原生编译，
  # 产物同样是静态、零动态依赖，且不需要下载一百多 MB 的工具链。
  # aarch64 通过 QEMU 模拟 arm64 容器完成。
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: 注册 QEMU（仅 arm64 需要）
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 在 Alpine 里静态编译并打包
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            alpine:3.20 \
            sh -c "apk add --no-cache build-base binutils bash >/dev/null &&
                   ./build.sh --cc gcc --arch ${{ matrix.arch }}"

      - name: 校验产物（必须静态、零依赖）
        run: |
          f="prebuilt/${{ matrix.arch }}/cloud_control"
          file "$f"
          readelf -h "$f" | grep -q 'EXEC'
          if readelf -d "$f" | grep -q NEEDED; then
            echo "::error::产物仍有动态库依赖"
            exit 1
          fi
          ls -lh luci-app-cloud-control-*-${{ matrix.arch }}.tar.gz
          echo "静态、零依赖 ✓"

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cloud-control-${{ matrix.arch }}
          path: luci-app-cloud-control-*-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 打 tag 时自动建 Release 并附上两个架构的压缩包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ lint, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列一下待发布的文件
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
